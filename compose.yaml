services:
  vietnam-atlas:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - atlas_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  atlas_storage:
