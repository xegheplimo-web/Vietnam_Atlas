# SonarCloud — cấu hình phân tích cho Vietnam_Atlas
# Lý do tồn tại: `tools/benchmark_e3a.py` là CLI đo lường chạy local, nhận path do
# operator chỉ định (--db/--out/--baseline) và áp pattern lấy từ schema đã commit.
# Không có ranh giới đặc quyền nào bị vượt qua, nên S2083 (path traversal) và
# S2631 (ReDoS) là false positive có chủ ý — suppress theo (rule, file), không
# tắt rule cho toàn repo.
sonar.projectKey=xegheplimo-web_Vietnam_Atlas
sonar.organization=xegheplimo-web
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Fixture sinh tự động + tài liệu không phải code sản phẩm
sonar.exclusions=tests/fixtures/**,docs/**,web/vendor/**,**/*.min.js

sonar.issue.ignore.multicriteria=cliPathTraversal,cliSchemaRegex
sonar.issue.ignore.multicriteria.cliPathTraversal.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.cliPathTraversal.resourceKey=tools/benchmark_e3a.py
sonar.issue.ignore.multicriteria.cliSchemaRegex.ruleKey=pythonsecurity:S2631
sonar.issue.ignore.multicriteria.cliSchemaRegex.resourceKey=tools/benchmark_e3a.py
