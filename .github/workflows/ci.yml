name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run integration tests (unittest)
        run: python -m unittest discover -s tests -v
      - name: Coverage report (Ubuntu / Python 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install --quiet --only-binary :all: coverage==7.16.2
          python -m coverage run -m unittest discover -s tests
          python -m coverage report -m

  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet --only-binary :all: ruff==0.17.0
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Python syntax check (compileall)
        run: python -m compileall -q server tools tests
      - name: JavaScript syntax check (node --check)
        run: node --check web/app.js
      - name: Validate JSON data files
        run: |
          python - <<'PY'
          import json
          import pathlib
          for name in ("data/provinces_34.json", "data/province_mergers_2025.json",
                       "data/sample_places_synthetic.geojson"):
              json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              print("valid:", name)
          PY

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vietnam-atlas:ci .
      - name: Run container and check /api/health
        run: |
          docker run -d --name atlas-ci -p 127.0.0.1:8765:8765 vietnam-atlas:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health > health.json; then ok="yes"; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Container did not become healthy in time"
            docker logs atlas-ci
            exit 1
          fi
          cat health.json
          python3 -c "import json; d=json.load(open('health.json')); assert d.get('ok') is True, d"
      - name: Remove container
        if: always()
        run: docker rm -f atlas-ci || true
